<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mid-test</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="mid.css" />
  </head>
  <body>
    <div class="container">
      <nav class="navbar-container">
        <div class="input-container">
          <img class="icon" src="../imges/iconsearch.svg" alt="icon" />
          <input
            type="search"
            name="user-search"
            id="user-search"
            placeholder="Search for a part-time job"
          />
        </div>
        <div class="nav-action">
          <button class="btn-usemap">
            <img src="../imges/iconmap.svg" alt="icon" />
            Use map
          </button>
        </div>
      </nav>
      <div class="category">
        <ul class="group-category">
          <li class="list-item">
            <a href="#" class="item-link">
              <img src="../imges/furniture.svg" alt="icon" />
              <p class="detail-item">Furniture</p>
            </a>
          </li>
          <li class="list-item">
            <a href="#" class="item-link">
              <img src="../imges/home.svg" alt="icon" />
              <p class="detail-item">Property</p>
            </a>
          </li>
          <li class="list-item">
            <a href="#" class="item-link">
              <img src="../imges/job.svg" alt="icon" />
              <p class="detail-item">Job</p>
            </a>
          </li>
          <li class="list-item">
            <a href="#" class="item-link">
              <img src="../imges/travel.svg" alt="icon" />
              <p class="detail-item">Travel</p>
            </a>
          </li>
          <li class="list-item">
            <a href="#" class="item-link">
              <img src="../imges/boat.svg" alt="icon" />
              <p class="detail-item">Boat</p>
            </a>
          </li>
          <li class="list-item">
            <a href="" class="item-link">
              <img src="../imges/mc.svg" alt="icon" />
              <p class="detail-item">MC</p>
            </a>
          </li>
          <li class="list-item">
            <a href="" class="item-link">
              <img src="../imges/economy.svg" alt="icon" />
              <p class="detail-item">Economy</p>
            </a>
          </li>
          <li class="list-item">
            <a href="" class="item-link">
              <img src="../imges/holiday.svg" alt="icon" />
              <p class="detail-item">Holiday</p>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
